apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-generator
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-generator
  template:
    metadata:
      labels:
        app: anomaly-generator
    spec:
      containers:
      - name: generator
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          i=0
          while true; do
            i=$((i+1))

            if [ $((i % 10)) -eq 0 ]; then
              echo "$(date) ERROR database timeout latency=5000ms status=500"
            else
              echo "$(date) INFO request latency=100ms status=200"
            fi

            sleep 2
          done
