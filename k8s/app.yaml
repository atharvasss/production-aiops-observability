apiVersion: v1
kind: Namespace
metadata:
  name: aiops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-service
  namespace: aiops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-service
  template:
    metadata:
      labels:
        app: demo-service
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo "$(date) INFO request_latency=120ms status=200"
            sleep 5
          done
